version: 2
models:
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: sku
        tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_date
        tests: [not_null]
  - name: stg_order_items
    columns:
      - name: product_id
        tests:
          - relationships:
              arguments: {to: ref('stg_products'), field: product_id}
